<!-- Gerçek GTÜ kampüsü üzerinde ziyaretçi animasyonu, sade ve akıcı sürüm (26 Ekim 2026). Veriyi kayit.js verir: init(veri), render(t sn).
     Akıcılık ilkeleri: her kare yalnızca t'ye bağlıdır; kamera yolu açılışta önceden hesaplanır (kritik sönümlü yay + yumuşatma);
     ziyaretçi yumuşatılmış yolda sabit hızla (başta/sonda kısa hızlanma) yürür; etiketler dünyadaki sabit noktaya bağlıdır, yer
     değiştirmez, 0,4 sn'de belirir/kaybolur. Görünüm: uydu görüntüsü zemindir; yalnızca sahnede önemli 4–5 bina hafifçe vurgulanır
     (gerçek yükseklik ×1). Ağ kullanılmaz. -->

</head><body><canvas id="c" width="1664" height="700"></canvas>
<script>
const cv = document.getElementById('c'), x = cv.getContext('2d'), W = 1664, H = 700, SW = 1168;   // SW: sahne genişliği (sağda panel)
const FONT = "Inter, 'DejaVu Sans', Arial, sans-serif";
// Kampüs saatlik PM2.5 profili (anlık görüntü, 20 Ekim 2026; iso_engine.js ile aynı)
const PH = [13.36,13.76,14.36,14.83,15.32,15.81,16.3,15.98,14.94,13.98,13.09,12.39,12.31,12.35,11.51,10.64,9.66,9.41,9.42,10,10.59,11.57,12.41,13.03];
const R0 = 6378137, U3 = 3, ELEV = 58;          // doku 3× büyütülmüş; bakış yüksekliği 58° (hafif eğik)
const FADE = .4;                                // etiket belirme/kaybolma süresi (sn)
let D, SC, RT, DG, G, TEX, TEXM, HAZE, ICON, mpp, segs, tot, TOTAL, G0, BLD = [], ROAD, ROADL, CAFE, KEY, CAM, CAPS, LBL, MOTES, CARS, C = null;

const merc = (lon, lat) => [lon * Math.PI / 180 * R0, R0 * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))];
const P = ll => { const m = merc(ll[0], ll[1]); return [G.s * m[0] + G.tx, -G.s * m[1] + G.ty]; };   // boylam/enlem → kaynak pikseli
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, f) => a + (b - a) * f;
const sm = v => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); }, smm = v => { v = clamp(v, 0, 1); return v * v * v * (v * (v * 6 - 15) + 10); };
function rnd(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
const tm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.floor(m % 60)).padStart(2, '0');

// ── kamera ve izdüşüm (ortografik; bakış yönü + sabit hafif eğim) ──
function setCam(k, cu, cv_, psi) {
  const a = psi * Math.PI / 180, E = ELEV * Math.PI / 180;
  C = { k, cu, cv: cv_, psi, fx: Math.sin(a), fy: -Math.cos(a), rx: Math.cos(a), ry: Math.sin(a), sE: Math.sin(E), cE: Math.cos(E), sx: SW / 2, sy: H / 2 - 10 };
}
const S = (u, v, z) => [C.sx + C.k * ((u - C.cu) * C.rx + (v - C.cv) * C.ry),
                        C.sy - C.k * C.sE * ((u - C.cu) * C.fx + (v - C.cv) * C.fy) - C.k * C.cE * (z || 0) / mpp];
const depth = (u, v) => (u - C.cu) * C.fx + (v - C.cv) * C.fy;   // büyük = uzak
function layerT(zm, s) {   // katman pikseli (s kaynak pikseli) → ekran
  const o = S(G.crop[0], G.crop[1], zm);
  x.setTransform(C.k * C.rx * s, -C.k * C.sE * C.fx * s, C.k * C.ry * s, -C.k * C.sE * C.fy * s, o[0], o[1]);
}

// ── yardımcılar ──
function poly(pts, f, s, w) { x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); if (f) { x.fillStyle = f; x.fill(); } if (s) { x.strokeStyle = s; x.lineWidth = w || 1.5; x.stroke(); } }
function shade(rgb, k) { return `rgb(${clamp(rgb[0] * k, 0, 255) | 0},${clamp(rgb[1] * k, 0, 255) | 0},${clamp(rgb[2] * k, 0, 255) | 0})`; }
const aqi = v => v <= 12 ? '#3FB950' : v <= 35.4 ? '#E3B341' : v <= 55.4 ? '#F0883E' : '#F85149';
const fnt = (n, b) => x.font = (b ? '700 ' : '400 ') + n + 'px ' + FONT;
const rr = (l, t, w, h, r, f) => { x.fillStyle = f; x.beginPath(); x.roundRect(l, t, w, h, r); x.fill(); };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const inter = (a, b) => a && b && a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
function wrap(t, w) { const out = []; let cur = ''; for (const wd of t.split(' ')) { const tr = cur ? cur + ' ' + wd : wd; if (x.measureText(tr).width > w && cur) { out.push(cur); cur = wd; } else cur = tr; } out.push(cur); return out; }

// Yol: merkezcil Catmull-Rom ile yumuşatılır, yay uzunluğuna göre örneklenir (sabit hızlı hareket için)
function smoothPath(pts, n) {

  for (let i = 1; i < Pp.length - 2; i++) {
    const p0 = Pp[i - 1], p1 = Pp[i], p2 = Pp[i + 1], p3 = Pp[i + 2];
    const tj = (a, b) => Math.pow(Math.hypot(b[0] - a[0], b[1] - a[1]) || 1e-4, .5);
    const t0 = 0, t1 = t0 + tj(p0, p1), t2 = t1 + tj(p1, p2), t3 = t2 + tj(p2, p3);
    for (let j = 0; j < n; j++) {
      const t = lerp(t1, t2, j / n), L = (a, b, ta, tb) => [0, 1].map(k => (tb - t) / (tb - ta) * a[k] + (t - ta) / (tb - ta) * b[k]);
      const A1 = L(p0, p1, t0, t1), A2 = L(p1, p2, t1, t2), A3 = L(p2, p3, t2, t3), B1 = L(A1, A2, t0, t2), B2 = L(A2, A3, t1, t3);

}
function arcTab(p) { const c = [0]; for (let i = 1; i < p.length; i++) c.push(c[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1])); return { p, c, L: c.at(-1) }; }
function atLen(T, s) {   // yay uzunluğu s'deki nokta ve yön
  s = clamp(s, 0, T.L); let lo = 0, hi = T.c.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (T.c[m] <= s) lo = m; else hi = m; }
  const a = T.p[lo], b = T.p[hi], d = T.c[hi] - T.c[lo] || 1, f = (s - T.c[lo]) / d;
  return { p: [lerp(a[0], b[0], f), lerp(a[1], b[1], f)], dir: [(b[0] - a[0]) / d, (b[1] - a[1]) / d], i: lo };
}
const trap = (u, a) => u < a ? u * u / (2 * a * (1 - a)) : u > 1 - a ? 1 - (1 - u) * (1 - u) / (2 * a * (1 - a)) : (u - a / 2) / (1 - a);   // yamuk hız profili

// Güneş konumu (20 Ekim, 40,8° K, 29,36° D, UTC+3): yükseklik ve azimut (kuzeyden saat yönünde)
function sun(clockMin) {
  const doy = 293, dec = -23.44 * Math.cos(2 * Math.PI / 365 * (doy + 10)) * Math.PI / 180, B = 2 * Math.PI * (doy - 81) / 364;
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B), solar = clockMin - 180 + 4 * 29.36 + eot;
  const ha = (solar / 4 - 180) * Math.PI / 180, la = 40.806 * Math.PI / 180;
  const el = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(ha));
  const az = Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(la) - Math.tan(dec) * Math.cos(la)) + Math.PI;
  return { el: el * 180 / Math.PI, az };
}
const phAt = clk => { const h = clk / 60, i = Math.floor(h) % 24, f = h - Math.floor(h); return lerp(PH[i], PH[(i + 1) % 24], f); };   // saatler arası yumuşak

// ── kurulum ──
window.init = async function (data) {
  D = data; KEY = data.key; SC = data.sahneler[KEY]; RT = data.rotalar[KEY]; DG = RT.dogal; G = data.georef; mpp = G.m_per_px;
  await document.fonts.load('700 24px Inter'); await document.fonts.load('400 24px Inter');
  TEX = new Image(); TEX.src = data.doku; await TEX.decode();
  if (data.ikon) { ICON = new Image(); ICON.src = data.ikon; await ICON.decode(); }
  // sakin, doğal renk: dokuyu bir kez hafifçe soldur
  TEXM = document.createElement('canvas'); TEXM.width = TEX.width; TEXM.height = TEX.height;
  { const g = TEXM.getContext('2d'); g.filter = 'saturate(0.8) contrast(0.97) brightness(1.02)'; g.drawImage(TEX, 0, 0); }
  // binalar (yalnız vurgulananlar çizilir; yükseklik gerçek ×1)
  const H_ = data.rotalar.yukseklik_m;
  data.geo.features.forEach((f, i) => {
    const p = f.properties; if (p.cat !== 'bina') return; const name = (p.name || '').trim(); if (!DG.vurgu.includes(name)) return;
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates[0]] : f.geometry.coordinates.map(q => q[0]);
    for (const ring of polys) {
      let pts = ring.map(P); if (Math.hypot(pts[0][0] - pts.at(-1)[0], pts[0][1] - pts.at(-1)[1]) < 1e-6) pts = pts.slice(0, -1);
      const c = pts.reduce((m, q) => [m[0] + q[0] / pts.length, m[1] + q[1] / pts.length], [0, 0]);
      BLD.push({ name, pts, h: name in H_ ? H_[name] : H_._varsayilan, c });
    }
  });
  const bh = name => (BLD.filter(b => b.name === name).sort((a, b) => b.h - a.h)[0] || { h: 0 }).h;
  // zaman çizelgesi; yürüyüş yolları önceki/sonraki durağa bağlanır (sıçrama olmasın)
  G0 = RT.giris || 0;
  segs = SC.segs.map((s, i) => ({ ...s, dur: RT.sure ? RT.sure[i] : s.dur, label: (RT.etiket && RT.etiket[i]) || s.label,
    raw: RT.paths[i] ? RT.paths[i].map(P) : null, at: RT.at[i] ? P(RT.at[i]) : null }));
  segs.forEach((s, i) => {
    s.z = s.inside ? bh(RT.ic[s.in]) : 0;
    if (!s.raw) return; const r = s.raw.slice(), pv = segs[i - 1], nx = segs[i + 1];
    if (pv && pv.at && Math.hypot(pv.at[0] - r[0][0], pv.at[1] - r[0][1]) > .5) r.unshift(pv.at);
    if (nx && nx.at && Math.hypot(nx.at[0] - r.at(-1)[0], nx.at[1] - r.at(-1)[1]) > .5) r.push(nx.at);
    s.T = arcTab(smoothPath(r, 14));
  });
  tot = G0; segs.forEach(s => { s.t0 = tot; tot += s.dur; }); TOTAL = tot + (RT.bekle != null ? RT.bekle : SC.hold);
  segs.forEach((s, i) => { const pv = segs[i - 1]; s.tele = !!(pv && !s.T && !pv.T && pv.at && s.at && Math.hypot(pv.at[0] - s.at[0], pv.at[1] - s.at[1]) > 2); });
  ROAD = arcTab(smoothPath(data.rotalar.ana_yol.map(P), 12)); CAFE = P(data.rotalar.kafe);
  buildHaze(); buildMotes(); buildCars();
  buildCamera(); buildLabels(); buildCaptions();
  return { total: TOTAL, tot, still: TOTAL, bld: BLD.length, k: [CAM.k0, CAM.k1, CAM.k2] };
};

// ── zaman çizelgesi ──
function state(el) {
  let si = segs.findIndex(s => el < s.t0 + s.dur); const done = si < 0; if (done) si = segs.length - 1;
  const s = segs[si], q = done ? 1 : clamp((el - s.t0) / s.dur, 0, 1);
  let pos, z = s.z;
  if (s.T) { const a = Math.min(.18, .6 / s.dur); pos = atLen(s.T, trap(q, a) * s.T.L).p; z = 0;
    const pv = segs[si - 1], nx = segs[si + 1], u = (el - s.t0);     // binadan çıkış / binaya giriş: yükseklik yumuşak değişir
    if (pv && pv.z) z = Math.max(z, pv.z * (1 - sm(u / .5)));
    if (nx && nx.z) z = Math.max(z, nx.z * sm((u - s.dur + .5) / .5)); }
  else pos = s.at;
  let al = 1;                                                        // iç mekândan iç mekâna geçiş: işaret söner, yenisi yanar
  if (s.tele && !done) al = sm((el - s.t0 - .25) / .35);
  const nx = segs[si + 1]; if (nx && nx.tele) al = Math.min(al, sm((nx.t0 - el - .05) / .35));
  return { si, s, q, done, pos, z, al, clock: s.m0 + (s.m1 - s.m0) * q };
}
const tAtClock = m => { const g = segs.find(s => m >= s.m0 && m < s.m1) || segs[0]; return g.t0 + (m - g.m0) / (g.m1 - g.m0) * g.dur; };

// ── kamera: açılış (geniş) → yumuşak izleme → kapanış (geniş, telefonun sağında); önceden hesaplanır ──
function frame(pts, reg, kmax) {   // noktaları ekran bölgesine sığdıran ölçek ve merkez
  setCam(1, 0, 0, RT.bakis); const sp = pts.map(p => S(p[0], p[1], 0)), xs = sp.map(q => q[0]), ys = sp.map(q => q[1]);
  const k = Math.min(kmax || 99, (reg[2] - reg[0]) / (Math.max(...xs) - Math.min(...xs) + 1), (reg[3] - reg[1]) / (Math.max(...ys) - Math.min(...ys) + 1));
  const mx = (Math.max(...xs) + Math.min(...xs)) / 2, my = (Math.max(...ys) + Math.min(...ys)) / 2;
  // ekran ofsetini kaynak koordinatına çevir (S doğrusal): (u,v) → ekran yönleri
  const sx0 = S(0, 0, 0), su = S(1, 0, 0), svv = S(0, 1, 0), a = su[0] - sx0[0], b = svv[0] - sx0[0], c = su[1] - sx0[1], d = svv[1] - sx0[1], det = a * d - b * c;
  const inv = (X, Y) => [(d * X - b * Y) / det, (-c * X + a * Y) / det];
  const pc = inv(mx - sx0[0], my - sx0[1]);                         // nokta bulutunun ekran merkezine karşılık gelen kaynak noktası
  const off = inv(((reg[0] + reg[2]) / 2 - C.sx) / k, ((reg[1] + reg[3]) / 2 - C.sy) / k);
  return { k, cu: pc[0] - off[0], cv: pc[1] - off[1] };
}
function clampCam(k, cu, cvv) {   // doku sınırının dışını göstermesin
  setCam(k, cu, cvv, RT.bakis); const us = [], vs = [];
  for (const [X, Y] of [[0, 0], [SW, 0], [0, H], [SW, H]]) { const a = (X - C.sx) / k, b = (C.sy - Y) / (k * C.sE); us.push(cu + a * C.rx + b * C.fx); vs.push(cvv + a * C.ry + b * C.fy); }
  const lo = [G.crop[0] + 10, G.crop[1] + 10], hi = [G.crop[0] + TEX.width / U3 - 10, G.crop[1] + TEX.height / U3 - 10];
  const fix = (mn, mx, l, h) => mx - mn > h - l ? (l + h) / 2 - (mn + mx) / 2 : mn < l ? l - mn : mx > h ? h - mx : 0;
  return [cu + fix(Math.min(...us), Math.max(...us), lo[0], hi[0]), cvv + fix(Math.min(...vs), Math.max(...vs), lo[1], hi[1])];
}
function buildCamera() {
  const pts = segs.flatMap(s => s.T ? s.T.p.filter((_, i) => i % 6 === 0) : [s.at]);
  const W0 = frame(pts, [70, 110, SW - 70, H - 150], DG.genis_max), W1 = frame(pts, [24 + 380 + 80, 110, SW - 60, H - 210], DG.genis_max);
  const k1 = DG.yakin, HZ = 60, N = Math.ceil(TOTAL * HZ) + 2, om = DG.yay || 1.4, dt = 1 / HZ;
  const T = [], tgt = t => state(Math.min(t, tot)).pos;
  let p = tgt(0).slice(), v = [0, 0];
  for (let j = 0; j < N; j++) {
    const t = j * dt, g = tgt(t);
    for (let s = 0; s < 4; s++) { for (const i of [0, 1]) { const a = om * om * (g[i] - p[i]) - 2 * om * v[i]; v[i] += a * dt / 4; p[i] += v[i] * dt / 4; } }   // kritik sönümlü yay
    const eIn = smm((t - (G0 - .7)) / 3.2), eOut = smm((t - (tot - .9)) / 3.3);
    let lk = lerp(lerp(Math.log(W0.k), Math.log(k1), eIn), Math.log(W1.k), eOut);
    let cu = lerp(lerp(W0.cu, p[0], eIn), W1.cu, eOut), cvv = lerp(lerp(W0.cv, p[1], eIn), W1.cv, eOut);
    [cu, cvv] = clampCam(Math.exp(lk), cu, cvv); T.push([lk, cu, cvv]);
  }

  const Ts = T.map((_, j) => { const o = [0, 0, 0]; let ws = 0; for (let i = -R; i <= R; i++) { const q = T[clamp(j + i, 0, N - 1)]; o[0] += q[0] * wts[i + R]; o[1] += q[1] * wts[i + R]; o[2] += q[2] * wts[i + R]; ws += wts[i + R]; } return o.map(u => u / ws); });

}
function camAt(t) { const f = clamp(t, 0, TOTAL) * CAM.HZ, j = Math.floor(f), a = CAM.T[Math.min(j, CAM.T.length - 1)], b = CAM.T[Math.min(j + 1, CAM.T.length - 1)], u = f - j;
  return [Math.exp(lerp(a[0], b[0], u)), lerp(a[1], b[1], u), lerp(a[2], b[2], u)]; }

// ── kirlilik: yol ve kafe çevresinde yumuşak, yarı saydam turuncu pus (temsilî); bir kez çizilir ──
function buildHaze() {
  const w = TEX.width / U3, h = TEX.height / U3; HAZE = document.createElement('canvas'); HAZE.width = w; HAZE.height = h; const g = HAZE.getContext('2d');
  const tr = p => [p[0] - G.crop[0], p[1] - G.crop[1]];
  const road = (lw, col, blur) => { g.filter = `blur(${blur}px)`; g.strokeStyle = col; g.lineWidth = lw; g.lineCap = g.lineJoin = 'round'; g.beginPath(); ROAD.p.forEach((p, i) => { const q = tr(p); i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }); g.stroke(); };
  road(36, 'rgba(238,132,58,0.50)', 14); road(14, 'rgba(232,96,60,0.40)', 6);
  const c = tr(CAFE); g.filter = 'blur(5px)'; const rg = g.createRadialGradient(c[0], c[1], 2, c[0], c[1], 34);
  rg.addColorStop(0, 'rgba(240,128,56,0.78)'); rg.addColorStop(.55, 'rgba(240,140,60,0.42)'); rg.addColorStop(1, 'rgba(238,132,58,0)'); g.fillStyle = rg; g.beginPath(); g.arc(c[0], c[1], 34, 0, 6.29); g.fill(); g.filter = 'none';
}
function buildMotes() {   // pus içinde sabit dünya noktalarında yavaşça süzülen tozlar (kamera ile yeniden örneklenmez)
  MOTES = [];
  for (let i = 0; i < 140; i++) { const a = atLen(ROAD, rnd(i) * ROAD.L), n = [-a.dir[1], a.dir[0]], o = (rnd(i + 300) - .5) * 30; MOTES.push({ u: a.p[0] + n[0] * o, v: a.p[1] + n[1] * o, ph: rnd(i + 600) * 6.28, s: .6 + rnd(i + 900) * .8 }); }
  for (let i = 0; i < 26; i++) { const r = Math.sqrt(rnd(i + 1200)) * 22, a = rnd(i + 1500) * 6.28; MOTES.push({ u: CAFE[0] + Math.cos(a) * r, v: CAFE[1] + Math.sin(a) * r, ph: rnd(i + 1800) * 6.28, s: .6 + rnd(i + 2100) * .6 }); }
}
function buildCars() {   // ana yolda sabit hızlı araçlar (13–17 m/sn), iki şerit
  CARS = []; for (let i = 0; i < 14; i++) CARS.push({ dir: i % 2, v: (13 + 4 * rnd(i)) / mpp, s0: rnd(i + 50) * ROAD.L, col: [[233, 229, 220], [70, 98, 160], [168, 64, 60], [52, 56, 64], [214, 196, 150], [170, 174, 180], [236, 236, 236]][i % 7] });
}

// ── etiketler: dünyadaki sabit noktaya bağlı, sabit ekran ofseti, ince bağlantı çizgisi, 0,4 sn'de belirir/kaybolur ──
