<html><head><meta charset="utf-8"><title>COP31 · ziyaretçi (gerçek kampüs)</title>
<!-- Gerçek GTÜ kampüsü üzerinde 3B ziyaretçi animasyonu (video için). Veriyi kayit.js verir: init(veri), render(t sn).
     Zaman deterministiktir (requestAnimationFrame yok); her kare yalnızca t'ye bağlıdır. Ağ kullanılmaz. -->
<link rel="stylesheet" href="../../frontend_v2/vendor/fonts/fonts.css">
<style>html,body{margin:0;background:#0E1626;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1664" height="700"></canvas>
<script>
const cv = document.getElementById('c'), x = cv.getContext('2d'), W = 1664, H = 700, SW = 1168;   // SW: sahne genişliği (sağda panel)
const FONT = "Inter, 'DejaVu Sans', Arial, sans-serif";
// Kampüs saatlik PM2.5 profili (anlık görüntü, 20 Ekim 2026; iso_engine.js ile aynı)
const PH = [13.36,13.76,14.36,14.83,15.32,15.81,16.3,15.98,14.94,13.98,13.09,12.39,12.31,12.35,11.51,10.64,9.66,9.41,9.42,10,10.59,11.57,12.41,13.03];
const R0 = 6378137, U3 = 3;           // doku 3× büyütülmüş
let D, SC, RT, G, TEX, mpp, VE, segs, tot, TOTAL, BLD = [], ROAD, CAFE, KEY, PATHS = [], OV, FIELD = null, FIELDHR = -1;
let SXO = 0, G0 = 0, ICON = null, C = null, Rr = [], PR = [0, 0, 0, 0], BI = 0;
const sh = document.createElement('canvas'); sh.width = W; sh.height = H; const sx = sh.getContext('2d');

const merc = (lon, lat) => [lon * Math.PI / 180 * R0, R0 * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))];
const P = ll => { const m = merc(ll[0], ll[1]); return [G.s * m[0] + G.tx, -G.s * m[1] + G.ty]; };   // boylam/enlem → kaynak pikseli
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), sm = v => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); };
const lerp = (a, b, f) => a + (b - a) * f;

// ── kamera ve izdüşüm (ortografik; bakış yönü + eğim) ──
function setCam(k, cu, cv_, psi) {

}
const S = (u, v, z) => [C.sx + C.k * ((u - C.cu) * C.rx + (v - C.cv) * C.ry),
                        C.sy - C.k * C.sE * ((u - C.cu) * C.fx + (v - C.cv) * C.fy) - C.k * C.cE * (z || 0) * VE / mpp];
const depth = (u, v) => (u - C.cu) * C.fx + (v - C.cv) * C.fy;   // büyük = uzak
function groundT(zm) {   // doku pikseli → ekran (zm: metre yükseklik)
  const o = S(G.crop[0], G.crop[1], zm);
  x.setTransform(C.k * C.rx / U3, -C.k * C.sE * C.fx / U3, C.k * C.ry / U3, -C.k * C.sE * C.fy / U3, o[0], o[1]);
}

// ── yardımcılar ──
function poly(pts, f, s, w) { x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); if (f) { x.fillStyle = f; x.fill(); } if (s) { x.strokeStyle = s; x.lineWidth = w || 1.5; x.stroke(); } }

const fnt = (n, b) => x.font = (b ? '700 ' : '400 ') + n + 'px ' + FONT;
const rr = (l, t, w, h, r, f) => { x.fillStyle = f; x.beginPath(); x.roundRect(l, t, w, h, r); x.fill(); };

function pill(px, py, t, bg, fg, force, nofade, must) {   // ekran uzayında etiket; çakışırsa yukarı/aşağı kaydırır, olmazsa çizmez
  fnt(24, 1); const L = t.split('\n'), n = L.length - 1, tw = Math.max(...L.map(l => x.measureText(l).width)), hh = 38 + n * 30;
  const PO = [[0, 0], [0, -44], [0, 44], [0, -88], [0, 88], [-170, 0], [170, 0], [-170, 60], [170, 60], [0, 132]];
  for (let pi = 0; pi <= PO.length; pi++) {

    const cx = clamp(px + dx, tw / 2 + 24, SW - tw / 2 - 20), top = py - 30 - n * 30 + dy, r = [cx - tw / 2 - 12, top, cx + tw / 2 + 12, top + hh];

}
function along(p, q) { const L = []; let tot = 0; for (let i = 0; i < p.length - 1; i++) { const d = Math.hypot(p[i + 1][0] - p[i][0], p[i + 1][1] - p[i][1]); L.push(d); tot += d; }

// Güneş konumu (20 Ekim, 40,8° K, 29,36° D, UTC+3): yükseklik ve azimut (kuzeyden saat yönünde)
function sun(clockMin) {

  const ha = (solar / 4 - 180) * Math.PI / 180, la = 40.806 * Math.PI / 180;

  return { el: el * 180 / Math.PI, az };

// ── kurulum ──
window.init = async function (data) {
  D = data; KEY = data.key; SC = data.sahneler[KEY]; RT = data.rotalar[KEY]; G = data.georef; mpp = G.m_per_px; VE = data.rotalar.dikey_abartma;
  await document.fonts.load('700 24px Inter'); await document.fonts.load('400 24px Inter');
  TEX = new Image(); TEX.src = data.doku; await TEX.decode();
  if (data.ikon) { ICON = new Image(); ICON.src = data.ikon; await ICON.decode(); }
  segs = SC.segs.map((s, i) => ({ ...s, dur: RT.sure ? RT.sure[i] : s.dur, label: (RT.etiket && RT.etiket[i]) || s.label, path: RT.paths[i] ? RT.paths[i].map(P) : null, at: RT.at[i] ? P(RT.at[i]) : null }));
  G0 = RT.giris || 0; tot = G0; segs.forEach(s => { s.t0 = tot; tot += s.dur; }); TOTAL = tot + (RT.bekle != null ? RT.bekle : SC.hold);   // tot = son durağın bitiş anı
  ROAD = data.rotalar.ana_yol.map(P); CAFE = P(data.rotalar.kafe);
  const H_ = data.rotalar.yukseklik_m, flat = new RegExp(data.rotalar.duz_alan, 'i');
  data.geo.features.forEach((f, i) => {
    const p = f.properties; if (p.cat !== 'bina') return; const name = (p.name || '').trim();
    if (name && flat.test(name)) return; const h = name in H_ ? H_[name] : H_._varsayilan; if (!h) return;
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates[0]] : f.geometry.coordinates.map(q => q[0]);
    for (const ring of polys) {
      let pts = ring.map(P); if (Math.hypot(pts[0][0] - pts.at(-1)[0], pts[0][1] - pts.at(-1)[1]) < 1e-6) pts = pts.slice(0, -1);
      let a = 0; pts.forEach((q, j) => { const r = pts[(j + 1) % pts.length]; a += q[0] * r[1] - r[0] * q[1]; });
      const c = pts.reduce((m, q) => [m[0] + q[0] / pts.length, m[1] + q[1] / pts.length], [0, 0]);
      BLD.push({ name, id: i, pts, h, c, cw: a > 0, plain: (G.masked[i] || 0) > 0.2 });
    }
  });
  tintBuildings();
  // genel bakış kamerası: tüm güzergâh
  const all = segs.flatMap(s => s.path || [s.at]); setCam(1, 0, 0, RT.bakis);
  const sp = all.map(q => S(q[0], q[1], 0)), xs = sp.map(q => q[0]), ys = sp.map(q => q[1]);
  const k0 = Math.min((SW - 220) / (Math.max(...xs) - Math.min(...xs)), (H - 230) / (Math.max(...ys) - Math.min(...ys)));
  const cu = all.reduce((m, q) => m + q[0], 0) / all.length, cvv = all.reduce((m, q) => m + q[1], 0) / all.length;
  setCam(k0, cu, cvv, RT.bakis); const c2 = S((Math.min(...all.map(q => q[0])) + Math.max(...all.map(q => q[0]))) / 2, (Math.min(...all.map(q => q[1])) + Math.max(...all.map(q => q[1]))) / 2, 0);
  OV = { k: k0, cu: (Math.min(...all.map(q => q[0])) + Math.max(...all.map(q => q[0]))) / 2, cv: (Math.min(...all.map(q => q[1])) + Math.max(...all.map(q => q[1]))) / 2 };
  return { total: TOTAL, tot, still: TOTAL, bld: BLD.length, k0 };

// ── zaman çizelgesi ──
function state(el) {
  let si = segs.findIndex(s => el < s.t0 + s.dur); const done = si < 0; if (done) si = segs.length - 1;
  const s = segs[si], q = done ? 1 : clamp((el - s.t0) / s.dur, 0, 1);
  return { si, s, q, done, pos: s.path ? along(s.path, q)[1] : s.at, clock: s.m0 + (s.m1 - s.m0) * q };
}
function camAt(t) {
  let fu = 0, fv = 0, n = 0; for (let j = 0; j < 30; j++) { const st = state(Math.max(0, Math.min(tot, t - j * 0.1))); fu += st.pos[0]; fv += st.pos[1]; n++; }
  fu /= n; fv /= n;
  const e = sm((t - G0 + .3) / 3.2) * (1 - sm((t - tot - 0.3) / 2.8));   // açılışta genel bakış, sonra yumuşak yakınlaşma
  const fE = RT.asistan ? sm((t - tot - RT.son_gec + 1.2) / 1.6) : 0; SXO = 190 * fE;   // sonda telefon solda: sahneyi sağa kaydır
  const k = OV.k * Math.pow(RT.yakin / OV.k, e) * (1 - .14 * fE);
  return clampCam(k, lerp(OV.cu, fu, e), lerp(OV.cv, fv, e));
}
// kamera, sahne alanının dışına (doku sınırı ötesine) bakmasın
function clampCam(k, cu, cvv) {
  setCam(k, cu, cvv, RT.bakis); const us = [], vs = [];
  for (const [X, Y] of [[0, 0], [SW, 0], [0, H], [SW, H]]) { const a = (X - C.sx) / k, b = (C.sy - Y) / (k * C.sE); us.push(cu + a * C.rx + b * C.fx); vs.push(cvv + a * C.ry + b * C.fy); }
  const lo = [G.crop[0] + 2, G.crop[1] + 2], hi = [G.crop[0] + TEX.width / U3 - 2, G.crop[1] + TEX.height / U3 - 2];
  const fix = (mn, mx, l, h) => mx - mn > h - l ? (l + h) / 2 - (mn + mx) / 2 : mn < l ? l - mn : mx > h ? h - mx : 0;
  return [k, cu + fix(Math.min(...us), Math.max(...us), lo[0], hi[0]), cvv + fix(Math.min(...vs), Math.max(...vs), lo[1], hi[1])];
}

// ── kirlilik alanı (temsilî): ana yol kenarı + kafe çevresi; saatlik profil ile ölçeklenir ──
function fieldVal(u, v) { return .55 + 1.9 * Math.exp(-dpoly(u, v, ROAD) / 22) + 1.0 * Math.exp(-Math.hypot(u - CAFE[0], v - CAFE[1]) / 14); }
function buildField(hr) {
  const cs = 3, w = Math.ceil(1200 / cs), h = Math.ceil(820 / cs), c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), im = g.createImageData(w, h), base = PH[hr] / 16;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const v = fieldVal(G.crop[0] + (i + .5) * cs, G.crop[1] + (j + .5) * cs) * base, col = heat((v - .55) / 2.2), o = (j * w + i) * 4;
    im.data[o] = col[0]; im.data[o + 1] = col[1]; im.data[o + 2] = col[2]; im.data[o + 3] = 255 * (.08 + .44 * clamp((v - .5) / 1.6, 0, 1));
  }
  g.putImageData(im, 0, 0); return { c, cs };
}

// ── çizim parçaları ──
const WALL = [218, 211, 199];
function tintBuildings() {   // duvar rengi: çatının uydu rengine hafifçe yaklaştır (gerçekçilik)
  const c = document.createElement('canvas'), w = TEX.width / 6 | 0, h = TEX.height / 6 | 0; c.width = w; c.height = h; const g = c.getContext('2d');
  g.drawImage(TEX, 0, 0, w, h); const im = g.getImageData(0, 0, w, h).data;
  for (const b of BLD) { let r = 0, gg = 0, bb = 0, n = 0; for (const q of [b.c, ...b.pts.map(p => [lerp(p[0], b.c[0], .4), lerp(p[1], b.c[1], .4)])]) {
      const i = Math.round((q[0] - G.crop[0]) * U3 / 6), j = Math.round((q[1] - G.crop[1]) * U3 / 6); if (i < 0 || j < 0 || i >= w || j >= h) continue;
      const o = (j * w + i) * 4; r += im[o]; gg += im[o + 1]; bb += im[o + 2]; n++; }

    let nx = ey / L, ny = -ex / L; if (!b.cw) { nx = -nx; ny = -ny; }     // dışa bakan normal
    // kaynak pikselde v aşağı doğru; saat yönü kontrolü ters olabilir → merkezden uzaklaşan yönü seç
    const mx = (a[0] + c[0]) / 2, my = (a[1] + c[1]) / 2; if ((mx + nx - b.c[0]) ** 2 + (my + ny - b.c[1]) ** 2 < (mx - nx - b.c[0]) ** 2 + (my - ny - b.c[1]) ** 2) { nx = -nx; ny = -ny; }

    if (w.L * mpp > 5 && b.h >= 4) for (let z = 1.0; z + 1.3 < b.h - .4; z += 3.4) {     // pencere bantları (kat başına)

function shadowOf(b, off) {

}
function dev(px, py, k, led) { rr(px - k, py - k * 1.4, k * 2, k * 2.8, k * .5, '#1C2028'); x.strokeStyle = led; x.lineWidth = k * .35; x.beginPath(); x.arc(px, py - k * .5, k * .5, 0, 6.29); x.stroke(); }

function person(u, v, col, walk, t, led) {

function person0(g, col, walk, t, led) { x.fillStyle = 'rgba(8,12,18,.45)'; x.beginPath(); x.ellipse(g[0], g[1], 18, 7, 0, 0, 6.29); x.fill();

  x.strokeStyle = '#1A2233'; x.lineWidth = 8; x.beginPath(); x.moveTo(g[0], g[1] - 30); x.lineTo(g[0] - sw, g[1] - 2); x.moveTo(g[0], g[1] - 30); x.lineTo(g[0] + sw, g[1] - 2); x.stroke();
